name: publish

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish-tauri:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: build tailwind css
        run: npm run build:css

      - name: verify mpv files
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/libmpv-2.dll")) {
            Write-Error "Missing src-tauri/libmpv-2.dll"
            exit 1
          }
          if (!(Test-Path "src-tauri/mpv.lib")) {
            Write-Error "Missing src-tauri/mpv.lib"
            exit 1
          }
          Write-Host "mpv files present"

      - name: build and publish tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: "windows build"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
